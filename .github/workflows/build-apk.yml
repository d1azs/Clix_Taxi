name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd clix_app
          echo "GOOGLE_MAPS_API_KEY=YOUR_API_KEY_HERE" > .env
          flutter pub get

      - name: Build APK
        run: |
          cd clix_app
          flutter build apk --release

      - name: Rename APK file with run number
        run: |
          mv clix_app/build/app/outputs/flutter-apk/app-release.apk clix_app/build/app/outputs/flutter-apk/clix-taxi-build-${{ github.run_number }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clix-taxi-app-build-${{ github.run_number }}
          path: clix_app/build/app/outputs/flutter-apk/clix-taxi-build-${{ github.run_number }}.apk
